name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, do not use this form; follow the [security policy](https://github.com/azevedo1z/ArtiGate/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign up as a reviewer
        2. Pay the access fee
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend API
        - Frontend
        - Payments
        - Article submission / PDF
        - Reviews
        - Database / Prisma
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: payment-mode
    attributes:
      label: Payment mode
      options:
        - Mock (ENABLE_PAYMENT_MOCK=true)
        - Mercado Pago
        - Not relevant
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.12.0"
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs or error responses
      description: Remove secrets, tokens and personal data before pasting.
      render: shell
